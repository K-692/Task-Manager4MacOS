name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test on macOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Show Swift & OS Version
        run: |
          sw_vers
          swift --version

      - name: Build All Targets
        run: swift build -v

      - name: Run Test Suite
        run: swift run TaskManagerTestRunner

      - name: Package macOS App Bundle
        run: ./Scripts/build-app.sh

      - name: Verify Distribution Artifact
        run: |
          ls -la dist/
          test -d "dist/Task Manager.app"
          test -x "dist/Task Manager.app/Contents/MacOS/TaskManager"
